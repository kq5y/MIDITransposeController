name: MIDITransposeController
options:
  bundleIdPrefix: local.miditranspose
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "1.10.0"

targets:
  MIDITransposeController:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: KeyboardShortcuts
      - sdk: CoreMIDI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.miditranspose.MIDITransposeController
        PRODUCT_NAME: MIDITransposeController
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: MIDI Transpose
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_APP_SANDBOX: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  MIDITransposeControllerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: MIDITransposeController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.miditranspose.MIDITransposeControllerTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MIDITransposeController.app/Contents/MacOS/MIDITransposeController"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  MIDITransposeController:
    build:
      targets:
        MIDITransposeController: all
        MIDITransposeControllerTests: [test]
    test:
      targets:
        - MIDITransposeControllerTests
